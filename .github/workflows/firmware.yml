name: Build RangeLink32 Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "firmware/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
      - "tests/**"
      - "VERSION"
      - "manifest.json"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
      - "tests/**"
      - "VERSION"
      - "manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rangelink32-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Verify stable browser firmware matches VERSION tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git log -1 --pretty=%s)" == release:* ]]; then
            echo "Release-preparation commit: browser firmware will be refreshed later in this job."
            exit 0
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          git fetch --tags origin

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Stable VERSION tag $TAG is missing."
            exit 1
          fi

          for file in             docs/firmware/bootloader.bin             docs/firmware/partitions.bin             docs/firmware/boot_app0.bin             docs/firmware/firmware.bin             docs/firmware/rangelink32-full.bin             docs/firmware/rangelink32-ota.bin
          do
            tmp="$(mktemp)"
            git show "$TAG:$file" > "$tmp"

            if ! cmp -s "$file" "$tmp"; then
              echo "::error::$file differs from stable $TAG. Browser installer must remain pinned to the current release."
              rm -f "$tmp"
              exit 1
            fi

            rm -f "$tmp"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          manifest = json.loads(Path("manifest.json").read_text())
          if manifest.get("version") != version:
              raise SystemExit(
                  f"manifest version {manifest.get('version')} != VERSION {version}"
              )
          print(f"Stable browser firmware matches v{version}")
          PY

      - name: Run host logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/include \
            tests/policy_logic_test.cpp \
            -o /tmp/rangelink32-policy-tests
          /tmp/rangelink32-policy-tests

      - name: Build ESP32 firmware
        run: pio run -e esp32dev

      - name: Enforce firmware size budget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path(".pio/build/esp32dev/firmware.bin")
          size = app.stat().st_size
          partition_limit = 1_310_720
          hard_limit = int(partition_limit * 0.90)

          print(
              f"Firmware binary: {size:,} bytes "
              f"({size / partition_limit:.1%} of app partition)"
          )

          if size > hard_limit:
              raise SystemExit(
                  f"Firmware exceeds the 90% safety budget "
                  f"({hard_limit:,} bytes). Reduce flash usage "
                  f"before adding more features."
              )
          PY

      - name: Prepare browser and release firmware
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/esp32dev"
          WEB="docs/firmware"
          mkdir -p "$WEB"

          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"

          BOOT_APP="$BUILD/boot_app0.bin"
          if [ ! -f "$BOOT_APP" ]; then
            BOOT_APP="$(find ~/.platformio/packages -name boot_app0.bin -type f | head -n 1)"
          fi
          test -n "$BOOT_APP"
          test -f "$BOOT_APP"

          cp "$BUILD/bootloader.bin" "$WEB/bootloader.bin"
          cp "$BUILD/partitions.bin" "$WEB/partitions.bin"
          cp "$BOOT_APP" "$WEB/boot_app0.bin"
          cp "$BUILD/firmware.bin" "$WEB/firmware.bin"
          cp "$BUILD/firmware.bin" "$WEB/rangelink32-ota.bin"

          python -m esptool \
            --chip esp32 \
            merge-bin \
            --flash-mode dio \
            --flash-size 4MB \
            --output "$WEB/rangelink32-full.bin" \
            0x1000 "$WEB/bootloader.bin" \
            0x8000 "$WEB/partitions.bin" \
            0xe000 "$WEB/boot_app0.bin" \
            0x10000 "$WEB/firmware.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: rangelink32-${{ github.ref_name }}-firmware
          path: |
            docs/firmware/rangelink32-full.bin
            docs/firmware/rangelink32-ota.bin
            docs/firmware/bootloader.bin
            docs/firmware/partitions.bin
            docs/firmware/boot_app0.bin
            docs/firmware/firmware.bin

      - name: Update browser-installable firmware
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f docs/firmware/*.bin

          if git diff --cached --quiet; then
            echo "Browser firmware already current."
          else
            git commit -m "build: update RangeLink32 browser firmware [skip ci]"
          fi

          git pull --rebase origin main
          git push

      - name: Create version tag for release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must use semantic version format, for example 1.0.1"
            exit 1
          fi

          TAG="v$VERSION"
          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Releases are immutable; bump VERSION instead."
            exit 1
          fi

          git tag -a "$TAG" -m "RangeLink32 $TAG"
          git push origin "$TAG"

      - name: Publish current VERSION release when tag exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must use semantic version format."
            exit 1
          fi

          TAG="v$VERSION"
          git fetch --tags origin

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist yet; nothing to publish."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable release left unchanged."
            exit 0
          fi

          RELEASE_DIR="$(mktemp -d)"
          git show "$TAG:docs/firmware/rangelink32-full.bin" > "$RELEASE_DIR/rangelink32-full.bin"
          git show "$TAG:docs/firmware/rangelink32-ota.bin" > "$RELEASE_DIR/rangelink32-ota.bin"

          (
            cd "$RELEASE_DIR"
            sha256sum               rangelink32-full.bin               rangelink32-ota.bin               > SHA256SUMS.txt
          )

          NOTES=".github/releases/$TAG.md"

          if [ -f "$NOTES" ]; then
            gh release create "$TAG"               --verify-tag               --title "RangeLink32 $TAG"               --notes-file "$NOTES"               --latest               "$RELEASE_DIR/rangelink32-full.bin"               "$RELEASE_DIR/rangelink32-ota.bin"               "$RELEASE_DIR/SHA256SUMS.txt"
          else
            gh release create "$TAG"               --verify-tag               --title "RangeLink32 $TAG"               --generate-notes               --latest               "$RELEASE_DIR/rangelink32-full.bin"               "$RELEASE_DIR/rangelink32-ota.bin"               "$RELEASE_DIR/SHA256SUMS.txt"
          fi

      - name: Publish immutable tagged firmware release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite immutable release assets."
            exit 1
          fi

          sha256sum \
            docs/firmware/rangelink32-full.bin \
            docs/firmware/rangelink32-ota.bin \
            > docs/firmware/SHA256SUMS.txt

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "RangeLink32 $TAG" \
            --generate-notes \
            docs/firmware/rangelink32-full.bin \
            docs/firmware/rangelink32-ota.bin \
            docs/firmware/SHA256SUMS.txt
