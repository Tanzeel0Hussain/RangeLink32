name: Optimize RangeLink32 Site Assets

on:
  push:
    branches: [main]
    paths:
      - "assets/*.webp"
      - "scripts/optimize_assets.py"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rangelink32-assets-main
  cancel-in-progress: true

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: pip install pillow

      - name: Optimize WebP assets
        run: python scripts/optimize_assets.py

      - name: Publish optimized assets
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- assets; then
            echo "Assets already optimized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.webp
          git commit -m "perf: optimize RangeLink32 web assets [skip ci]"
          git pull --rebase origin main
          git push
