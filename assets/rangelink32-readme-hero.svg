<svg xmlns="http://www.w3.org/2000/svg" width="1279" height="720" viewBox="0 0 1279 720" role="img" aria-labelledby="title desc">
<title id="title">RangeLink32 3D project hero</title>
<desc id="desc">RangeLink32 cyber-tech Wi-Fi gateway hero with a 3D snow-leopard mascot and ESP32 networking theme.</desc>
<defs>
  <linearGradient id="fallback" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020914"/>
    <stop offset=".5" stop-color="#071b31"/>
    <stop offset="1" stop-color="#04233d"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1279" height="720" rx="26" fill="url(#fallback)"/>
<circle cx="1050" cy="170" r="140" fill="#13cfff" opacity=".12" filter="url(#glow)"/>
<image href="data:image/webp;base64," width="1279" height="720" preserveAspectRatio="xMidYMid slice"/>
<rect x="1.5" y="1.5" width="1276" height="717" rx="25" fill="none" stroke="#34d7ff" stroke-opacity=".26" stroke-width="3"/>
</svg>